---
- name: Sicheres Lab-Backup
  hosts: ziel
  become: true

  vars:
    backup_name: "backup-{{ ansible_date_time.iso8601_basic_short }}.tar.gz"
    remote_dir: /root/lifecycle-backups
    local_dir: /home/wahab/backups

  tasks:
    - name: Sicheres temporaeres Verzeichnis erstellen
      ansible.builtin.file:
        path: "{{ remote_dir }}"
        state: directory
        mode: '0700'

    - name: Backup-Verzeichnis auf Control Node erstellen
      ansible.builtin.file:
        path: "{{ local_dir }}"
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false

    - name: Backup erstellen
      community.general.archive:
        path:
          - /etc
          - /home/wahab/wichtige-daten
        dest: "{{ remote_dir }}/{{ backup_name }}"
        format: gz
        mode: '0600'

    - name: Backup auf Control Node uebertragen
      ansible.builtin.fetch:
        src: "{{ remote_dir }}/{{ backup_name }}"
        dest: "{{ local_dir }}/{{ backup_name }}"
        flat: true

    - name: Backup-Datei auf Control Node absichern
      ansible.builtin.file:
        path: "{{ local_dir }}/{{ backup_name }}"
        mode: '0600'
      delegate_to: localhost
      become: false

    - name: Temporaeres Backup entfernen
      ansible.builtin.file:
        path: "{{ remote_dir }}/{{ backup_name }}"
        state: absent
