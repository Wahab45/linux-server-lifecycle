---
- name: Sicherer Restore-Test
  hosts: ziel
  become: true

  vars:
    backup_file: "{{ (lookup('fileglob', '/home/wahab/backups/backup-*.tar.gz', wantlist=True) | sort | last) }}"
    restore_dir: /root/lifecycle-restore-test

  tasks:
    - name: Restore-Verzeichnis erstellen
      ansible.builtin.file:
        path: "{{ restore_dir }}"
        state: directory
        mode: '0700'

    - name: Backup zum Zielserver kopieren
      ansible.builtin.copy:
        src: "{{ backup_file }}"
        dest: /root/lifecycle-restore.tar.gz
        mode: '0600'

    - name: Backup isoliert wiederherstellen
      ansible.builtin.unarchive:
        src: /root/lifecycle-restore.tar.gz
        dest: "{{ restore_dir }}"
        remote_src: true

    - name: Originaldatei pruefen
      ansible.builtin.stat:
        path: /home/wahab/wichtige-daten/kunden.txt
        checksum_algorithm: sha256
      register: original

    - name: Wiederhergestellte Datei pruefen
      ansible.builtin.stat:
        path: "{{ restore_dir }}/home/wahab/wichtige-daten/kunden.txt"
        checksum_algorithm: sha256
      register: restored

    - name: Dateien vergleichen
      ansible.builtin.assert:
        that:
          - original.stat.exists
          - restored.stat.exists
          - original.stat.checksum == restored.stat.checksum
        success_msg: "RESTORE VERIFIED - SHA256 MATCH"

    - name: Temporaeres Archiv entfernen
      ansible.builtin.file:
        path: /root/lifecycle-restore.tar.gz
        state: absent
